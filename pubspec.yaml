name: daily_app
description: "Daily App — A premium fitness tracking application with encrypted local storage."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Typography — Inter font from Google Fonts.
  google_fonts: ^6.2.1

  # State management.
  provider: ^6.1.2

  # Encrypted local storage.
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Platform-native secure storage for AES encryption key.
  flutter_secure_storage: ^9.2.3

  # App documents directory path.
  path_provider: ^2.1.4

  # Dependency injection.
  get_it: ^8.0.2

  # Unique ID generation.
  uuid: ^4.5.1

  # Date formatting.
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
